name: uptime

# Checks the live deployment twice a day. A failed run is the alert: GitHub emails the
# account that owns the schedule when a scheduled workflow fails. Set the repository
# variable LIVE_URL (Settings > Secrets and variables > Actions > Variables) to switch it on.
on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the live app
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$LIVE_URL" ]; then echo "LIVE_URL is not set, nothing to check yet."; exit 0; fi
          # One real question a day (the 05:17 UTC run); health and widget only the rest of the time.
          ARGS=""
          if [ "$(date -u +%H)" = "05" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="--chat"; fi
          # Free Render instances sleep when idle and a cold start can outlast the wake
          # timeout (a false "down" on 2026-11-05 22:01 UTC). Retry once after 90s before failing.
          python scripts/check_live.py "$LIVE_URL" $ARGS || { echo "First check failed, retrying in 90s"; sleep 90; python scripts/check_live.py "$LIVE_URL" $ARGS; }

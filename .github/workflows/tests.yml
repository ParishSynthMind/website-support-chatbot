name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (all AWS and model calls are stubbed, no secrets or network)
        run: pytest -v

  aws-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install cfn-lint
      - name: Lint the CloudFormation template
        run: cfn-lint infra/aws/template.yaml
      - name: Build the Lambda package the way deploy.sh does (arm64 wheels only)
        run: |
          python3 -m pip install --quiet --target build/pkg --platform manylinux2014_aarch64 \
            --implementation cp --python-version 3.12 --only-binary=:all: -r infra/aws/requirements-lambda.txt
          cp -R app knowledge_base widget demo build/pkg/
          (cd build/pkg && zip -qr9 ../function.zip .)
          ls -lh build/function.zip

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t support-chatbot .
      - name: Run the image and wait for its health check
        run: |
          docker run -d --name bot -p 8000:8000 support-chatbot
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' bot)
            echo "health: $status"
            [ "$status" = healthy ] && break
            sleep 3
          done
          [ "$status" = healthy ] || { docker logs bot; exit 1; }
      - name: Hit /health and /widget.js
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -o /dev/null -w 'widget.js %{http_code} %{content_type}\n' http://localhost:8000/widget.js
